trigger:
- main

pool:
  vmImage: 'windows-latest'

steps:

- task: NuGetToolInstaller@1

- task: NuGetCommand@2
  inputs:
    command: 'restore'
    restoreSolution: '**/*.sln'

- task: VSBuild@1
  inputs:
    solution: '**/*.sln'
    configuration: 'Release'

- task: VSTest@2
  inputs:
    platform: 'Any CPU'
    configuration: 'Release'