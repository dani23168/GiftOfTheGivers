# ASP.NET Core Continuous Integration and Automated Testing Pipeline
trigger:
- master
- development

pool:
  name: GiftOfTheGivers-Pool12

variables:
  buildConfiguration: 'Release'

steps:
# Install .NET 10 SDK (matching your development environment)
- task: UseDotNet@2
  displayName: 'Install .NET 10 SDK'
  inputs:
    packageType: 'sdk'
    version: '10.x'

# Restore dependencies for the entire solution
- script: dotnet restore GiftOfTheGivers.sln
  displayName: 'Restore solution dependencies'

# Build the entire solution (Web App + Test Project)
- script: dotnet build GiftOfTheGivers.sln --configuration $(buildConfiguration) --no-restore
  displayName: 'Build solution (Web App & Tests)'

# Run all automated Unit, Integration, and Selenium Tests automatically on commit
- script: dotnet test GiftOfTheGivers.sln --configuration $(buildConfiguration) --no-build --logger "trx"
  displayName: 'Run automated tests and generate test logs'
